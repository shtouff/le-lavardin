{{ $glob := .Get "glob" }}
{{ $images := cond (not (not $glob)) (.Page.Resources.Match $glob) (.Page.Resources.ByType "image") }}
{{ if $images }}
<div class="grid grid-cols-2 gap-2 my-6 sm:grid-cols-3">
  {{ range $images }}
    <a href="{{ .RelPermalink }}" target="_blank" rel="noopener">
      <img src="{{ .RelPermalink }}" alt="{{ $.Page.Title }}"
           class="rounded-md w-full" loading="lazy">
    </a>
  {{ end }}
</div>
{{ end }}
