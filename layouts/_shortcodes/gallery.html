{{ $glob := .Get "glob" | default "*.jpg" }}
{{ $images := .Page.Resources.Match $glob }}
{{ if $images }}
<div class="grid grid-cols-2 gap-2 my-6 sm:grid-cols-3">
  {{ range $images }}
    {{ $thumb := .Fill "600x600 webp smart" }}
    <a href="{{ .RelPermalink }}" target="_blank" rel="noopener">
      <img src="{{ $thumb.RelPermalink }}" alt="{{ $.Page.Title }}"
           class="rounded-md object-cover w-full aspect-square" loading="lazy">
    </a>
  {{ end }}
</div>
{{ end }}
