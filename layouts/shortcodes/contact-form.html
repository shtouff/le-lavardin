<form id="contact-form" action="https://api.web3forms.com/submit" method="POST" class="contact-form">
  <input type="hidden" name="access_key" value="{{ .Site.Params.web3forms_key }}">
  <input type="hidden" name="subject" value="Contact - Le Lavardin">
  <input type="hidden" name="from_name" value="Le Lavardin Contact">
  <input type="checkbox" name="botcheck" style="display:none;">

  <div class="form-group">
    <label for="cf-name">{{ i18n "form_name" }}</label>
    <input type="text" id="cf-name" name="name" required>
  </div>

  <div class="form-group">
    <label for="cf-email">{{ i18n "form_email" }}</label>
    <input type="email" id="cf-email" name="email" required>
  </div>

  <div class="form-group">
    <label for="cf-phone">{{ i18n "form_phone" }}</label>
    <input type="tel" id="cf-phone" name="phone">
  </div>

  <div class="form-group">
    <label for="cf-message">{{ i18n "form_message" }}</label>
    <textarea id="cf-message" name="message" rows="6" required></textarea>
  </div>

  <button type="submit" id="cf-submit">{{ i18n "form_send" }}</button>
  <p id="cf-result" style="display:none;"
     data-success="{{ i18n "form_success" }}"
     data-error="{{ i18n "form_error" }}"></p>
</form>

<script>
document.getElementById('contact-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var btn = document.getElementById('cf-submit');
  var result = document.getElementById('cf-result');
  btn.disabled = true;
  fetch('https://api.web3forms.com/submit', {
    method: 'POST',
    body: new FormData(this)
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    result.style.display = 'block';
    if (data.success) {
      result.textContent = result.dataset.success;
      result.style.color = 'green';
      document.getElementById('contact-form').reset();
    } else {
      result.textContent = result.dataset.error;
      result.style.color = 'red';
      btn.disabled = false;
    }
  })
  .catch(function() {
    result.style.display = 'block';
    result.textContent = result.dataset.error;
    result.style.color = 'red';
    btn.disabled = false;
  });
});
</script>
